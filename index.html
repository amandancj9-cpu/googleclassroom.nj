<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SolaraOS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: radial-gradient(circle at top left, #4b3bff 0%, #0b1024 40%, #050712 100%);
      color: #fff;
      height: 100vh;
      overflow: hidden;
    }

    /* Top bar */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: rgba(10, 10, 30, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 1000;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
    }

    .topbar-left .os-name {
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #ffd86b;
    }

    .topbar-left .window-title {
      opacity: 0.8;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 13px;
    }

    .pill {
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pill-label {
      opacity: 0.7;
    }

    .pill-value {
      font-weight: 500;
    }

    /* Layout */
    .desktop {
      position: absolute;
      top: 40px;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 16px 16px 64px 16px;
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 16px;
    }

    /* Left app grid */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      align-content: flex-start;
    }

    .app-tile {
      background: rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
    }

    .app-tile:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.4);
      background: rgba(255, 255, 255, 0.12);
    }

    .app-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #ff9f4b, #ff4b7a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .app-label {
      font-size: 11px;
      text-align: center;
      line-height: 1.2;
      opacity: 0.9;
    }

    /* Main area (windows) */
    .main-area {
      position: relative;
      border-radius: 18px;
      background: radial-gradient(circle at top left, rgba(255, 255, 255, 0.08), rgba(0, 0, 0, 0.7));
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .main-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      opacity: 0.7;
      pointer-events: none;
    }

    .main-placeholder h1 {
      font-size: 24px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .main-placeholder p {
      font-size: 13px;
    }

    /* Window */
    .window {
      position: absolute;
      top: 40px;
      left: 40px;
      width: 420px;
      min-height: 260px;
      background: rgba(10, 10, 30, 0.92);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      cursor: default;
    }

    .window-header {
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02));
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      cursor: grab;
    }

    .window-title {
      font-size: 13px;
      opacity: 0.85;
    }

    .window-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .control-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff5f57;
      cursor: pointer;
    }

    .control-dot:nth-child(2) {
      background: #febc2e;
    }

    .control-dot:nth-child(3) {
      background: #28c840;
    }

    .window-body {
      padding: 12px;
      font-size: 13px;
      line-height: 1.4;
    }

    .window-body h2 {
      font-size: 16px;
      margin-bottom: 8px;
    }

    .window-body p {
      opacity: 0.85;
      margin-bottom: 6px;
    }

    /* Dock */
    .dock {
      position: fixed;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(10, 10, 30, 0.9);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      z-index: 900;
    }

    .dock-item {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: linear-gradient(135deg, #4b9dff, #7b4bff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .dock-item:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      <span class="os-name">SolaraOS</span>
      <span class="window-title">Finder</span>
    </div>
    <div class="topbar-right">
      <div class="pill">
        <span class="pill-label">Now Listening</span>
        <span class="pill-value">Nothing playing</span>
      </div>
      <div class="pill">
        <span class="pill-label">Battery</span>
        <span class="pill-value">100%</span>
      </div>
      <div class="pill">
        <span class="pill-label">Wi‑Fi</span>
        <span class="pill-value">Connected</span>
      </div>
      <div class="pill">
        <span class="pill-value" id="time-pill"></span>
      </div>
      <div class="pill">
        <span class="pill-value" id="date-pill"></span>
      </div>
      <div class="pill">
        <span class="pill-label">Weather</span>
        <span class="pill-value">23°C · Clear · Chicago, US</span>
      </div>
    </div>
  </div>

  <div class="desktop">
    <div class="app-grid" id="app-grid">
      <!-- We’ll generate these via JS, but here’s the list -->
    </div>

    <div class="main-area" id="main-area">
      <div class="main-placeholder">
        <h1>SOLARAOS</h1>
        <p>Click any app on the left to open a window.</p>
      </div>
    </div>
  </div>

  <div class="dock" id="dock">
    <div class="dock-item" data-app="Settings">⚙️</div>
    <div class="dock-item" data-app="Terminal">>_</div>
    <div class="dock-item" data-app="Music">🎵</div>
    <div class="dock-item" data-app="Browser">🌐</div>
    <div class="dock-item" data-app="Files">📁</div>
  </div>

  <script>
    const apps = [
      "Games", "Solara AI", "Meet", "Themes", "Retro", "Paint", "Camera",
      "Soundboard", "Movies", "Notepad", "Roblox", "App Creator", "Anime",
      "JS Executor", "Calculator", "YouTube", "Global Chat", "Clock",
      "Cinera", "Inbox", "Calendar", "TikTok", "Solara ID", "Terminal",
      "Music", "Suggestions", "Celeste", "MP3 Player", "Links", "Fast.com"
    ];

    const appGrid = document.getElementById("app-grid");
    const mainArea = document.getElementById("main-area");

    // Create app tiles
    apps.forEach(name => {
      const tile = document.createElement("div");
      tile.className = "app-tile";
      tile.dataset.app = name;

      const icon = document.createElement("div");
      icon.className = "app-icon";
      icon.textContent = name[0];

      const label = document.createElement("div");
      label.className = "app-label";
      label.textContent = name;

      tile.appendChild(icon);
      tile.appendChild(label);
      appGrid.appendChild(tile);

      tile.addEventListener("click", () => openWindow(name));
    });

    // Dock clicks
    document.querySelectorAll(".dock-item").forEach(item => {
      item.addEventListener("click", () => openWindow(item.dataset.app));
    });

    function openWindow(appName) {
      // Remove placeholder
      const placeholder = document.querySelector(".main-placeholder");
      if (placeholder) placeholder.remove();

      const win = document.createElement("div");
      win.className = "window";

      const header = document.createElement("div");
      header.className = "window-header";

      const title = document.createElement("div");
      title.className = "window-title";
      title.textContent = appName;

      const controls = document.createElement("div");
      controls.className = "window-controls";

      const close = document.createElement("div");
      close.className = "control-dot";
      close.addEventListener("click", () => win.remove());

      const mini = document.createElement("div");
      mini.className = "control-dot";

      const max = document.createElement("div");
      max.className = "control-dot";

      controls.appendChild(close);
      controls.appendChild(mini);
      controls.appendChild(max);

      header.appendChild(title);
      header.appendChild(controls);

      const body = document.createElement("div");
      body.className = "window-body";
      body.innerHTML = `
        <h2>${appName}</h2>
        <p>This is a placeholder window for <strong>${appName}</strong>.</p>
        <p>You can replace this with your own app UI, games, tools, or anything you want.</p>
      `;

      win.appendChild(header);
      win.appendChild(body);
      mainArea.appendChild(win);

      makeDraggable(win, header);
    }

    function makeDraggable(win, handle) {
      let offsetX = 0;
      let offsetY = 0;
      let dragging = false;

      handle.addEventListener("mousedown", (e) => {
        dragging = true;
        handle.style.cursor = "grabbing";
        const rect = win.getBoundingClientRect();
        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;
        document.addEventListener("mousemove", onMouseMove);
        document.addEventListener("mouseup", onMouseUp);
      });

      function onMouseMove(e) {
        if (!dragging) return;
        const desktopRect = mainArea.getBoundingClientRect();
        let x = e.clientX - offsetX;
        let y = e.clientY - offsetY;

        // Keep inside main area
        const maxX = desktopRect.right - win.offsetWidth;
        const maxY = desktopRect.bottom - win.offsetHeight;
        const minX = desktopRect.left;
        const minY = desktopRect.top;

        x = Math.max(minX, Math.min(maxX, x));
        y = Math.max(minY, Math.min(maxY, y));

        win.style.left = (x - desktopRect.left) + "px";
        win.style.top = (y - desktopRect.top) + "px";
      }

      function onMouseUp() {
        dragging = false;
        handle.style.cursor = "grab";
        document.removeEventListener("mousemove", onMouseMove);
        document.removeEventListener("mouseup", onMouseUp);
      }
    }

    // Time + date
    function updateTime() {
      const now = new Date();
      const time = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      const date = now.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
      document.getElementById("time-pill").textContent = time;
      document.getElementById("date-pill").textContent = date;
    }
    updateTime();
    setInterval(updateTime, 1000);
  </script>
</body>
</html>
